<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeachPet Web - Caixa POS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        headerTeal: '#003847',
                        headerHover: '#002B37',
                        bgCream: '#FAF5EE',
                        cardBg: '#FFFFFF',
                        brandOrange: '#FF5A1F',
                        activeYellow: '#FFC83B',
                        activeYellowHover: '#E0AE2C',
                        softTeal: '#E0F2F1',
                        accentBlue: '#007791',
                        textDark: '#1E293B',
                        textMuted: '#64748B'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FAF5EE;
            font-family: 'Inter', sans-serif;
            color: #1E293B;
            user-select: none;
        }

        .logo-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            color: #FFFFFF;
            margin: 0 !important;
            padding: 0 !important;
            line-height: 1.1 !important;
            letter-spacing: -0.01em;
        }

        .logo-subtitle {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.72rem;
            color: #79D2E6;
            margin: 0 !important;
            padding: 0 !important;
            line-height: 1.0 !important;
        }

        .price-text {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            color: #FF5A1F;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 56, 71, 0.2);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 56, 71, 0.4);
        }

        @keyframes subtlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .active-tab {
            animation: subtlePulse 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-bgCream antialiased text-textDark">

    <!-- HEADER -->
    <header class="bg-headerTeal text-white px-4 lg:px-6 py-2.5 shadow-md sticky top-0 z-30">
        <div class="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-3">
            
            <div class="flex items-center space-x-3 cursor-pointer select-none" onclick="resetFilters()">
                <div class="w-10 h-10 rounded-full bg-activeYellow flex items-center justify-center shadow-inner relative overflow-hidden flex-shrink-0">
                    <svg class="w-7 h-7 text-headerTeal" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5c-2.49 0-4.5-1.79-4.5-4 0-1.18.58-2.25 1.5-3 .25 1.75 1.75 3 3.5 3s3.25-1.25 3.5-3c.92.75 1.5 1.82 1.5 3 0 2.21-2.01 4-4.5 4zm-3-7.5c-.83 0-1.5-.67-1.5-1.5S7.17 6 8 6s1.5.67 1.5 1.5S8.83 9 8 9zm8 0c-.83 0-1.5-.67-1.5-1.5S15.17 6 16 6s1.5.67 1.5 1.5S16.83 9 16 9z"/>
                    </svg>
                </div>
                
                <div class="flex flex-col justify-center">
                    <h3 class="logo-title">Beach Pet</h3>
                    <h4 class="logo-subtitle">Loja Praiana</h4>
                </div>
            </div>

            <nav class="flex items-center space-x-2">
                <button onclick="window.location.href='painel.html'" class="flex items-center space-x-2 px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-house text-xs"></i>
                    <span>Painel</span>
                </button>
                <button onclick="window.location.href='estoque.html'" class="flex items-center space-x-2 px-4 py-2 rounded-xl text-sm font-medium text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-box text-xs"></i>
                    <span>Estoque</span>
                </button>
                <button class="active-tab flex items-center space-x-2 px-5 py-2 rounded-xl text-sm font-semibold bg-activeYellow text-headerTeal shadow-md hover:bg-activeYellowHover transition">
                    <i class="fa-solid fa-cart-shopping text-xs"></i>
                    <span>Caixa</span>
                </button>
            </nav>

            <div class="flex items-center space-x-3">
                <div class="text-right hidden sm:block">
                    <div class="text-xs font-semibold text-white">Ana Souza</div>
                    <div class="inline-flex items-center space-x-1 text-[10px] font-bold text-activeYellow">
                        <i class="fa-solid fa-star"></i>
                        <span>Admin</span>
                    </div>
                </div>
                <button onclick="window.location.href='login.html'" class="bg-white/15 hover:bg-white/25 text-white text-xs font-medium px-3.5 py-2 rounded-xl transition flex items-center space-x-1.5">
                    <span>Sair</span>
                </button>
            </div>

        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-[1600px] mx-auto w-full p-4 lg:p-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- PRODUTOS -->
        <section class="lg:col-span-8 flex flex-col space-y-5">
            <div class="relative w-full">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input 
                    type="text" 
                    id="searchInput" 
                    oninput="handleSearch()"
                    placeholder="Buscar produto ou categoria..." 
                    class="w-full pl-11 pr-10 py-3.5 bg-white border border-slate-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-headerTeal focus:border-transparent text-sm placeholder-slate-400 transition"
                >
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex items-center space-x-2 overflow-x-auto pb-1 no-scrollbar text-sm" id="categoryPills"></div>

            <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 flex-1 items-start"></div>

            <div id="emptySearch" class="hidden flex-col items-center justify-center py-16 text-center text-slate-400">
                <i class="fa-solid fa-box-open text-4xl mb-3 text-slate-300"></i>
                <p class="font-medium text-slate-600">Nenhum produto encontrado</p>
            </div>
        </section>

        <!-- CARRINHO -->
        <section class="lg:col-span-4 flex flex-col">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col h-full sticky top-20">
                
                <div class="bg-headerTeal px-5 py-4 text-white flex items-center justify-between">
                    <div class="flex items-center space-x-2.5">
                        <i class="fa-solid fa-cart-shopping text-activeYellow text-lg"></i>
                        <h2 class="font-display font-bold text-lg">Carrinho</h2>
                    </div>
                    <span id="cartCountBadge" class="text-xs text-cyan-200 font-medium">0 itens</span>
                </div>

                <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-4 min-h-[260px] max-h-[420px] flex flex-col justify-between">
                    <div id="emptyCartState" class="flex flex-col items-center justify-center my-auto py-12 text-center text-slate-400">
                        <p class="text-sm font-medium text-slate-500">Nenhum item adicionado</p>
                        <p class="text-xs text-slate-400 mt-1">Clique nos produtos para inserir no carrinho</p>
                    </div>
                    <div id="cartList" class="space-y-3 hidden"></div>
                </div>

                <div class="bg-slate-50 border-t border-slate-200 p-4 space-y-4">
                    <div class="flex items-center justify-between text-sm">
                        <label for="discountInput" class="text-slate-600 font-medium">Desconto R$</label>
                        <input 
                            type="number" 
                            id="discountInput" 
                            min="0" 
                            step="0.50" 
                            value="0" 
                            oninput="updateCartTotals()"
                            class="w-24 px-3 py-1.5 text-right bg-white border border-slate-200 rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-headerTeal"
                        >
                    </div>

                    <div class="space-y-1.5 border-t border-slate-200 pt-3">
                        <div class="flex justify-between text-xs text-slate-500">
                            <span>Subtotal</span>
                            <span id="subtotalVal" class="font-semibold text-slate-700">R$ 0.00</span>
                        </div>
                        <div class="flex justify-between items-baseline pt-1">
                            <span class="font-display font-bold text-slate-800 text-base">Total</span>
                            <span id="totalVal" class="font-display font-extrabold text-2xl text-headerTeal">R$ 0.00</span>
                        </div>
                        <div class="flex justify-between items-center text-xs text-teal-700 font-medium bg-teal-50 border border-teal-100 rounded-lg px-2.5 py-1.5 mt-2">
                            <span>🐾 Doação ONGs (5%)</span>
                            <span id="ngoVal" class="font-bold">R$ 0.00</span>
                        </div>
                    </div>

                    <div class="space-y-1.5 pt-1">
                        <span class="text-xs font-semibold text-slate-600">Pagamento</span>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="selectPayment('dinheiro')" id="pay-dinheiro" class="pay-btn flex items-center justify-center py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-700">💵 Dinheiro</button>
                            <button onclick="selectPayment('pix')" id="pay-pix" class="pay-btn flex items-center justify-center py-2 bg-headerTeal text-white rounded-xl text-xs font-semibold">📱 Pix</button>
                            <button onclick="selectPayment('debito')" id="pay-debito" class="pay-btn flex items-center justify-center py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-700">💳 Débito</button>
                            <button onclick="selectPayment('credito')" id="pay-credito" class="pay-btn flex items-center justify-center py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-700">💳 Crédito</button>
                        </div>
                    </div>

                    <button 
                        id="finalizeBtn" 
                        onclick="finalizeSale()" 
                        disabled
                        class="w-full py-3 px-4 bg-activeYellow opacity-50 cursor-not-allowed text-headerTeal font-display font-bold text-sm rounded-xl transition flex items-center justify-center space-x-2 shadow-sm"
                    >
                        <i class="fa-solid fa-check-double"></i>
                        <span>Finalizar Venda</span>
                    </button>
                </div>

            </div>
        </section>

    </main>

    <script>
        let PRODUCTS = [];
        const CATEGORIES = ["Todos", "Bebidas", "Drinks", "Sorvetes", "Comidas", "Salgados", "Lembranças", "Pet"];
        let activeCategory = "Todos";
        let searchQuery = "";
        let cart = [];
        let selectedPayment = "pix";

        function getCategoryIcon(cat) {
            switch (cat) {
                case 'Bebidas': return '🥥';
                case 'Drinks': return '🍹';
                case 'Sorvetes': return '🍦';
                case 'Comidas': return '🫐';
                case 'Salgados': return '🫘';
                case 'Lembranças': return '🧢';
                case 'Pet': return '🐾';
                default: return '📦';
            }
        }

        async function carregarProdutosAPI() {
            try {
                const res = await fetch('http://127.0.0.1:3002/produtos');
                const data = await res.json();
                
                if (!Array.isArray(data) || data.length === 0) {
                    document.getElementById('productGrid').innerHTML = 
                        '<p class="col-span-4 text-center text-slate-500 py-10 font-medium">Nenhum produto cadastrado no banco.</p>';
                    return;
                }

                PRODUCTS = data.map(p => {
                    const idVal = p.id ?? p.id_produto ?? 0;
                    const nameVal = p.name ?? p.nome ?? 'Sem nome';
                    const catVal = p.category ?? p.categoria ?? 'Geral';
                    const priceVal = Number(p.price ?? p.preco_venda ?? 0);
                    const stockVal = Number(p.stock ?? p.quantidade_estoque ?? 0);

                    return {
                        id: idVal,
                        name: String(nameVal),
                        category: String(catVal),
                        price: isNaN(priceVal) ? 0 : priceVal,
                        stock: isNaN(stockVal) ? 0 : stockVal,
                        icon: getCategoryIcon(catVal)
                    };
                });

                renderCategories();
                renderProducts();
            } catch (err) {
                console.error('Erro ao conectar ao servidor:', err);
                const grid = document.getElementById('productGrid');
                if (grid) {
                    grid.innerHTML = '<p class="col-span-4 text-center text-red-500 py-10 font-medium">Erro ao conectar com o servidor (3001).</p>';
                }
            }
        }

        // Executa a busca assim que a página carrega
        document.addEventListener("DOMContentLoaded", function() {
            carregarProdutosAPI();
            updateCartUI();
        });

        function renderCategories() {
            const container = document.getElementById('categoryPills');
            if(!container) return;
            container.innerHTML = CATEGORIES.map(cat => {
                const isActive = cat === activeCategory;
                const cls = isActive ? "bg-headerTeal text-white font-semibold shadow-sm" : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 font-medium";
                return `<button onclick="setCategory('${cat}')" class="px-4 py-2 rounded-xl transition flex-shrink-0 ${cls}">${cat}</button>`;
            }).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const emptyState = document.getElementById('emptySearch');
            if(!grid) return;

            let filtered = PRODUCTS.filter(p => {
                const catText = (p.category || 'Geral').toLowerCase();
                const nameText = (p.name || '').toLowerCase();
                const search = (searchQuery || '').toLowerCase();

                const mCat = (activeCategory === "Todos") || (p.category === activeCategory);
                const mSrc = nameText.includes(search) || catText.includes(search);
                
                return mCat && mSrc;
            });

            if (filtered.length === 0) {
                grid.innerHTML = "";
                if(emptyState) {
                    emptyState.classList.remove('hidden');
                    emptyState.classList.add('flex');
                }
                return;
            } else {
                if(emptyState) {
                    emptyState.classList.add('hidden');
                    emptyState.classList.remove('flex');
                }
            }

            grid.innerHTML = filtered.map(prod => `
                <div onclick="addToCart(${prod.id})" class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs hover:shadow-md transition-all cursor-pointer flex flex-col justify-between group h-full">
                    <div class="text-4xl text-center py-3 group-hover:scale-110 transition-transform">${prod.icon}</div>
                    <div class="space-y-1">
                        <h3 class="font-bold text-slate-800 text-sm leading-tight">${prod.name}</h3>
                        <p class="text-[11px] text-cyan-600 font-medium">${prod.category}</p>
                        <div class="pt-1"><span class="price-text text-base">R$ ${prod.price.toFixed(2)}</span></div>
                        <p class="text-[10px] text-slate-400">${prod.stock} em estoque</p>
                    </div>
                </div>
            `).join('');
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderProducts();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = "";
            searchQuery = "";
            renderProducts();
        }

        function resetFilters() {
            activeCategory = "Todos";
            clearSearch();
            renderCategories();
        }

        function addToCart(productId) {
            const product = PRODUCTS.find(p => p.id === productId);
            if (!product) return;

            const idx = cart.findIndex(item => item.product.id === productId);
            if (idx > -1) {
                if (cart[idx].quantity < product.stock) {
                    cart[idx].quantity += 1;
                } else {
                    alert(`Estoque máximo atingido para ${product.name}!`);
                    return;
                }
            } else {
                cart.push({ product: product, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById('cartList');
            const emptyState = document.getElementById('emptyCartState');
            const countBadge = document.getElementById('cartCountBadge');
            const finalizeBtn = document.getElementById('finalizeBtn');

            const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
            if(countBadge) countBadge.innerText = `${totalItems} ${totalItems === 1 ? 'item' : 'itens'}`;

            if (cart.length === 0) {
                if(cartList) cartList.classList.add('hidden');
                if(emptyState) { emptyState.classList.remove('hidden'); emptyState.classList.add('flex'); }
                if(finalizeBtn) { finalizeBtn.disabled = true; finalizeBtn.classList.add('opacity-50', 'cursor-not-allowed'); }
            } else {
                if(emptyState) { emptyState.classList.add('hidden'); emptyState.classList.remove('flex'); }
                if(cartList) cartList.classList.remove('hidden');
                if(finalizeBtn) { finalizeBtn.disabled = false; finalizeBtn.classList.remove('opacity-50', 'cursor-not-allowed'); }

                if(cartList) {
                    cartList.innerHTML = cart.map(item => `
                        <div class="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200/70 rounded-xl space-x-2">
                            <div class="text-xl flex-shrink-0">${item.product.icon}</div>
                            <div class="flex-1 min-w-0">
                                <div class="text-xs font-bold text-slate-800 truncate">${item.product.name}</div>
                                <div class="text-[11px] text-slate-500">R$ ${item.product.price.toFixed(2)} cada</div>
                            </div>
                            <div class="flex items-center space-x-1.5 bg-white border border-slate-200 rounded-lg p-1">
                                <button onclick="changeQty(${item.product.id}, -1)" class="px-1.5 text-xs text-slate-500 hover:text-red-500 font-bold">-</button>
                                <span class="text-xs font-bold px-1">${item.quantity}</span>
                                <button onclick="changeQty(${item.product.id}, 1)" class="px-1.5 text-xs text-slate-500 hover:text-green-500 font-bold">+</button>
                            </div>
                        </div>
                    `).join('');
                }
            }
            updateCartTotals();
        }

        function changeQty(productId, delta) {
            const idx = cart.findIndex(item => item.product.id === productId);
            if (idx === -1) return;

            const newQty = cart[idx].quantity + delta;
            if (newQty <= 0) {
                cart.splice(idx, 1);
            } else if (newQty > cart[idx].product.stock) {
                alert(`Quantidade excede o estoque disponível (${cart[idx].product.stock})`);
            } else {
                cart[idx].quantity = newQty;
            }
            updateCartUI();
        }

        function updateCartTotals() {
            const subtotal = cart.reduce((acc, item) => acc + (item.product.price * item.quantity), 0);
            const discountInput = document.getElementById('discountInput');
            const discount = discountInput ? parseFloat(discountInput.value) || 0 : 0;
            const total = Math.max(0, subtotal - discount);
            const ngo = total * 0.05;

            if(document.getElementById('subtotalVal')) document.getElementById('subtotalVal').innerText = `R$ ${subtotal.toFixed(2)}`;
            if(document.getElementById('totalVal')) document.getElementById('totalVal').innerText = `R$ ${total.toFixed(2)}`;
            if(document.getElementById('ngoVal')) document.getElementById('ngoVal').innerText = `R$ ${ngo.toFixed(2)}`;
        }

        function selectPayment(metodo) {
            selectedPayment = metodo;
            document.querySelectorAll('.pay-btn').forEach(btn => {
                btn.classList.remove('bg-headerTeal', 'text-white');
                btn.classList.add('bg-white', 'text-slate-700');
            });
            const btnSel = document.getElementById(`pay-${metodo}`);
            if(btnSel) {
                btnSel.classList.remove('bg-white', 'text-slate-700');
                btnSel.classList.add('bg-headerTeal', 'text-white');
            }
        }

        async function finalizeSale() {
            if (cart.length === 0) return alert('O carrinho está vazio!');

            const subtotal = cart.reduce((acc, item) => acc + (item.product.price * item.quantity), 0);
            const discount = parseFloat(document.getElementById('discountInput').value) || 0;
            const total = Math.max(0, subtotal - discount);

            const dadosVenda = {
                formaPagamento: selectedPayment,
                valorTotal: total,
                itens: cart
            };

            try {
                const res = await fetch('http://127.0.0.1:3002/api/vendas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosVenda)
                });

                const result = await res.json();

                if (res.ok) {
                    alert('Venda realizada e registrada no MySQL com sucesso!');
                    cart = [];
                    updateCartUI();
                    carregarProdutosAPI();
                } else {
                    alert(result.erro || 'Erro ao registrar venda.');
                }
            } catch (err) {
                alert('Erro de conexão ao finalizar a venda.');
            }
        }
    </script>
</body>
</html>
